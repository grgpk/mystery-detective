services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alibi
      POSTGRES_PASSWORD: alibi
      POSTGRES_DB: last_alibi
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alibi -d last_alibi"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
